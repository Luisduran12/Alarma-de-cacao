# Revisión automática en cada push y en cada pull request.
# Aún no se ha ejecutado en GitHub: se escribió y se probó solo en local (los mismos comandos).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App Flutter (analyze y test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true
      - run: flutter pub get
      # Los avisos "info" actuales (APIs obsoletas) no bloquean; cualquier warning o error sí.
      - run: flutter analyze lib test --no-fatal-infos
      - run: flutter test --coverage
      - name: Cobertura de líneas
        run: |
          awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2} END{printf "Cobertura de líneas: %.1f %% (%d de %d)\n", 100*h/t, h, t}' coverage/lcov.info

  backend:
    name: Servidor (typecheck y test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

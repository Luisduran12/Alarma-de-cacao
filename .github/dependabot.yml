# Revisión semanal de dependencias (Flutter, servidor y acciones de GitHub).
# Sintaxis y valores verificados en la documentación oficial de Dependabot (opciones de configuración).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Ignorados POR AHORA: sus versiones nuevas exigen un Dart más reciente que el de Flutter 3.38.9 (Dart 3.10.8) y el
    # CI falla al resolver dependencias (url_launcher 6.3.3 y shared_preferences 2.5.6 piden Dart ^3.11; speech_to_text 7.5.0,
    # cupertino_icons 2.0.0 y sqflite 2.4.6 piden ^3.12). Quitar estas líneas cuando se suba la versión de Flutter (ver docs/seguridad-app.md, pendientes).
    ignore:
      - dependency-name: "url_launcher"
      - dependency-name: "speech_to_text"
      - dependency-name: "cupertino_icons"
      - dependency-name: "shared_preferences"
      - dependency-name: "sqflite"

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
